services:
  # 1. Django REST API Web Service
  - type: web
    name: invoice-chaser-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: invoice-chaser-db
          property: connectionString

databases:
  # 2. PostgreSQL Managed Database
  - name: invoice-chaser-db
    databaseName: invoicechaser
    user: invoiceuser
